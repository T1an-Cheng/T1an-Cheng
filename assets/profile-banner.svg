<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tian — research and experiments</title>
  <desc id="desc">An ivory research notebook with forest green orbital linework, a small vermilion sun, and a quiet Tian signature.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="298" rx="12"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="0.7" fill="#31564A" opacity="0.14"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="12" fill="#F5F3EB" stroke="#DFE2D7"/>
  <g clip-path="url(#frame)">
    <rect x="478" y="1" width="722" height="298" fill="url(#dots)"/>
    <path d="M478 25V275" stroke="#D9DED1"/>
    <path d="M510 150H1152M850 27V273" stroke="#B9C8B8" stroke-dasharray="3 7" opacity="0.6"/>
    <circle cx="850" cy="150" r="106" stroke="#D8DFD1"/>
    <circle cx="850" cy="150" r="75" stroke="#D8DFD1"/>
    <g transform="translate(850 150) rotate(-24)" stroke="#31594B" stroke-width="1.25">
      <ellipse rx="230" ry="42" opacity="0.35"/>
      <ellipse rx="230" ry="54" opacity="0.43"/>
      <ellipse rx="230" ry="66" opacity="0.52"/>
      <ellipse rx="230" ry="78" opacity="0.61"/>
      <ellipse rx="230" ry="90" opacity="0.7"/>
      <ellipse rx="230" ry="102" opacity="0.79"/>
      <ellipse rx="230" ry="114" opacity="0.88"/>
      <ellipse rx="230" ry="126"/>
    </g>
    <circle cx="850" cy="150" r="29" fill="#D56A49" stroke="#F5F3EB" stroke-width="5"/>
    <circle cx="842" cy="142" r="3" fill="#EBAA86"/>
    <circle cx="1057" cy="60" r="7" fill="#31594B" stroke="#F5F3EB" stroke-width="3"/>
    <circle cx="644" cy="239" r="5" fill="#F5F3EB" stroke="#31594B" stroke-width="1.5"/>
    <path d="M1096 228V242M1089 235H1103M576 55V65M571 60H581" stroke="#D56A49" stroke-width="1.5"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.7" fill="#738376">
      <text x="512" y="33">EXPLORATIONS / 01</text>
      <text x="1149" y="277" text-anchor="end">IDEAS IN ORBIT</text>
