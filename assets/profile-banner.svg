  </g>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <path d="M48 43H68M48 43V63" stroke="#31594B" stroke-width="2"/>
    <text x="83" y="62" fill="#24483D" font-size="30" font-weight="600" letter-spacing="-1">Tian<tspan fill="#D56A49">.</tspan></text>
    <text x="48" y="147" fill="#24483D" font-family="Georgia, 'Times New Roman', serif" font-size="38">A curious mind,</text>
    <text x="48" y="192" fill="#24483D" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic">in motion.</text>
    <path d="M48 229H81" stroke="#D56A49" stroke-width="2"/>
    <text x="48" y="259" fill="#687B6D" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.6">AGENTS / REASONING / LEARNING</text>
  </g>
