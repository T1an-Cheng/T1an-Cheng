  <title id="title">Tian — Sing me something new</title>
  <desc id="desc">Ivory paper, a small Tian signature, an italic lyric, and a single music note above three delicate orbital rings.</desc>
  <rect x="1" y="1" width="1198" height="258" rx="12" fill="#F5F3EB" stroke="#DFE2D7"/>
  <text x="49" y="51" fill="#24483D" font-family="'Segoe UI', Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="-0.6">Tian<tspan fill="#D56A49">.</tspan></text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="italic" fill="#24483D">
    <text x="49" y="131">Sing me</text>
    <text x="49" y="186">something new</text>
  </g>
